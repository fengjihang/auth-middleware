[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-middleware"
version = "0.1.0"
description = "生产级认证与授权中台"
readme = "README.md"
requires-python = ">=3.11"
# ---- 运行时依赖（生产环境需要）----
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "bcrypt>=4.0.1",
    "pyjwt>=2.9.0",
    "aiosqlite>=0.20.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "gunicorn>=22.0.0",
    "pycasbin>=1.26.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
]

# ---- 开发依赖（仅本地/CI 需要）----
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "locust>=2.24.0",
]

# ---- src 布局：包从 src/ 下发现 ----
[tool.setuptools.packages.find]
where = ["src"]

# ---- 把 casbin 的 .conf/.csv 也打进包（否则部署后找不到策略文件）----
[tool.setuptools.package-data]
auth_middleware = ["*.conf", "*.csv"]

# ---- ruff：lint + 自动 import 排序 ----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# ---- pytest：async 测试自动识别 ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
