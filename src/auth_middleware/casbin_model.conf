# Casbin 模型定义（RBAC 基础版）
# 只定义"逻辑"，不定义"谁能干什么"——具体策略都在 casbin_policy.csv 里。
# 改权限 = 改 csv，不动代码、不重新部署。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# sub 是角色（如 "admin"/"user"）；obj 是资源（如 "profile"/"users"）；act 是动作（read/write）
# 支持通配符：策略里写 "*" 表示"所有资源/所有动作"
m = r.sub == p.sub && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
